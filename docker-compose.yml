
# CineVerse local development stack.
#
# Start PostgreSQL:
#   docker compose up -d postgres
#
# Start PostgreSQL + Redis:
#   docker compose --profile redis up -d
#
# Start the entire application:
#   docker compose --profile app up -d --build
#
# View logs:
#   docker compose --profile app logs -f
#
# Stop containers without deleting database data:
#   docker compose --profile app down

services:
  postgres:
    image: postgres:16-alpine
    container_name: cineverse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cineverse
      POSTGRES_USER: ${DATABASE_USERNAME:-cineverse}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-cineverse}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: cineverse-redis
    restart: unless-stopped
    profiles:
      - redis
      - app
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: cineverse-backend
    restart: unless-stopped
    profiles:
      - app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/cineverse
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

      # Spring Boot Actuator health configuration
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"

    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8080/actuator/health | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_APP_NAME: BookMyEvent
    container_name: cineverse-frontend
    restart: unless-stopped
    profiles:
      - app
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://backend:8080
    ports:
      - "3000:3000"

volumes:
  pgdata:
